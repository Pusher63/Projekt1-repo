{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TASKLY – Login</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <!-- Zentriertes Formular mit Grid -->
  <div class="auth-wrap">
    <section class="card auth-card">
      <h1 class="auth-title">Anmelden</h1>
      <p class="muted">Willkommen zurück bei TASKLY</p>

      <!--
        Kein echtes Auth-System:
        - Speichert nur die E-Mail lokal, damit Index dich begrüßt.
      -->
      <form class="auth-form" onsubmit="storeName(event)">
        <label class="auth-field">
          <span>E-Mail</span>
          <input id="loginEmail" type="email" placeholder="name@mail.de" required />
        </label>

        <label class="auth-field">
          <span>Passwort</span>
          <input id="loginPassword" type="password" placeholder="(nur Demo, wird nicht geprüft)" required />
        </label>

        <button class="btn primary" onclick="window.location.href='{% url 'home' %}'">
  Einloggen
</button>

        <p class="muted small">
          Noch kein Konto?
          <a href="{% url 'register' %}">Jetzt registrieren</a>
        </p>
      </form>
    </section>
  </div>

 <script src="{% static 'app.js' %}"></script>
</body>
</html>
