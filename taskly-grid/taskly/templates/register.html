{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Registrieren – TASKLY</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="auth-body">
  <div class="auth-card card">
    <h1>Konto erstellen</h1>
    <form id="registerForm" class="auth-form">
      <label>Benutzername
        <input type="text" id="regUsername" required autocomplete="username">
      </label>
      <label>E-Mail
        <input type="email" id="regEmail" autocomplete="email">
      </label>
      <label>Passwort (min. 8 Zeichen)
        <input type="password" id="regPassword" minlength="8" required autocomplete="new-password">
      </label>
      <button class="btn primary" type="submit">Registrieren</button>
      <p class="muted">Schon ein Konto? <a href="/login/">Zum Login</a></p>
      <p id="registerError" class="error" aria-live="polite"></p>
    </form>
  </div>
  <script src="{% static 'auth.js' %}"></script>
</body>
</html>
